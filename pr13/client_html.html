<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog API — Клієнт</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;800&display=swap');

    :root {
      --bg: #0f0f13;
      --surface: #17171d;
      --surface2: #1e1e27;
      --border: #2a2a38;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --get: #22d3a5;
      --post: #60a5fa;
      --put: #fbbf24;
      --delete: #f87171;
      --text: #e2e0f0;
      --muted: #6b6880;
      --radius: 12px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .badge { background: var(--accent); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; vertical-align: middle; margin-left: 10px; }

    .main-layout {
      display: grid;
      grid-template-columns: 400px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ── Panel Left ── */
    .panel-left {
      border-right: 1px solid var(--border);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      background: var(--surface);
    }

    .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .label { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }

    .method-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .method-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      transition: 0.2s;
    }

    .method-btn.active[data-m="GET"] { border-color: var(--get); color: var(--get); background: rgba(34, 211, 165, 0.1); }
    .method-btn.active[data-m="POST"] { border-color: var(--post); color: var(--post); background: rgba(96, 165, 250, 0.1); }
    .method-btn.active[data-m="PUT"] { border-color: var(--put); color: var(--put); background: rgba(251, 191, 36, 0.1); }
    .method-btn.active[data-m="DELETE"] { border-color: var(--delete); color: var(--delete); background: rgba(248, 113, 113, 0.1); }

    .input-field {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: var(--radius);
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }

    .input-field:focus { border-color: var(--accent); }

    textarea.input-field { height: 180px; resize: none; font-size: 0.85rem; }

    .btn-send {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius);
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }
    .btn-send:hover { background: var(--accent2); transform: translateY(-2px); }

    /* ── Panel Right ── */
    .panel-right {
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .response-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-pill {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: none;
    }
    .status-2xx { background: rgba(34, 211, 165, 0.2); color: var(--get); border: 1px solid var(--get); }
    .status-4xx { background: rgba(248, 113, 113, 0.2); color: var(--delete); border: 1px solid var(--delete); }

    pre {
      background: var(--surface);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #d1d1e0;
      overflow-x: auto;
    }

    .key { color: #a78bfa; }
    .string { color: #22d3a5; }
    .number { color: #fbbf24; }
    .boolean { color: #f472b6; }
    .null { color: #94a3b8; }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--muted);
      gap: 1rem;
    }
    .empty-state .icon { font-size: 3rem; opacity: 0.2; }
  </style>
</head>
<body>

<div class="header">
  <h1>Blog REST API <span class="badge">V1.0</span></h1>
  <div id="respTime" style="color: var(--muted); font-size: 0.8rem; font-family: 'JetBrains Mono'; display: none;">0 ms</div>
</div>

<div class="main-layout">
  <div class="panel-left">

    <div class="control-group">
      <div class="label">Метод</div>
      <div class="method-selector">
        <button class="method-btn active" data-m="GET">GET</button>
        <button class="method-btn" data-m="POST">POST</button>
        <button class="method-btn" data-m="PUT">PUT</button>
        <button class="method-btn" data-m="DELETE">DELETE</button>
      </div>
    </div>

    <div class="control-group">
      <div class="label">Endpoint</div>
      <input type="text" id="endpoint" class="input-field" value="/posts">
    </div>

    <div class="control-group" id="bodySection" style="display: none;">
      <div class="label">JSON Body</div>
      <textarea id="bodyEditor" class="input-field" placeholder='{ "title": "...", "author": "..." }'></textarea>
    </div>

    <button class="btn-send" id="sendBtn">ВИКОНАТИ ЗАПИТ</button>

  </div>

  <div class="panel-right">
    <div class="response-header">
      <div class="label">Результат відповіді</div>
      <div id="statusPill" class="status-pill">200 OK</div>
    </div>

    <div id="responseBlock">
      <div class="empty-state">
        <div class="icon">⚡</div>
        <p>Оберіть метод та натисніть "Виконати запит"</p>
      </div>
    </div>
  </div>
</div>

<script>
  // ТУТ ВЖЕ ВИПРАВЛЕНИЙ ПОРТ ДЛЯ ВАШОГО СЕРВЕРА
  const BASE = 'http://localhost:8082';

  const btns = document.querySelectorAll('.method-btn');
  const bodySection = document.getElementById('bodySection');
  const sendBtn = document.getElementById('sendBtn');
  const endpointInput = document.getElementById('endpoint');
  let currentMethod = 'GET';

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMethod = btn.dataset.m;

      // Показуємо тіло запиту тільки для POST та PUT
      bodySection.style.display = (currentMethod === 'POST' || currentMethod === 'PUT') ? 'flex' : 'none';

      // Підказка для ендпоінта
      if (currentMethod === 'PUT' || currentMethod === 'DELETE') {
        if (endpointInput.value === '/posts') endpointInput.value = '/posts/1';
      }
    });
  });

  sendBtn.addEventListener('click', async () => {
    const endpoint = endpointInput.value.trim();
    const url = BASE + endpoint;
    const bodyText = document.getElementById('bodyEditor').value;
    const block = document.getElementById('responseBlock');
    const pill = document.getElementById('statusPill');
    const timeDisplay = document.getElementById('respTime');

    block.innerHTML = '<div class="empty-state">Завантаження...</div>';

    const t0 = performance.now();

    try {
      const options = {
        method: currentMethod,
        headers: { 'Content-Type': 'application/json' }
      };

      if (bodySection.style.display === 'flex' && bodyText) {
        options.body = bodyText;
      }

      const res = await fetch(url, options);
      const t1 = performance.now();

      timeDisplay.textContent = Math.round(t1 - t0) + ' ms';
      timeDisplay.style.display = 'block';

      pill.textContent = res.status + ' ' + res.statusText;
      pill.className = 'status-pill ' + (res.ok ? 'status-2xx' : 'status-4xx');
      pill.style.display = 'block';

      const data = await res.json();
      block.innerHTML = `<pre>${syntaxHighlight(JSON.stringify(data, null, 2))}</pre>`;

    } catch (err) {
      pill.style.display = 'none';
      block.innerHTML = `<div class="status-pill status-4xx" style="display:inline-block">Помилка з'єднання</div>
                         <p style="margin-top:10px; color:var(--muted)">Перевірте, чи запущено сервер: <b>php -S localhost:8082 api.php</b></p>`;
    }
  });

  function syntaxHighlight(json) {
    if (!json) return "";
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
      var cls = 'number';
      if (/^"/.test(match)) {
        if (/:$/.test(match)) {
          cls = 'key';
        } else {
          cls = 'string';
        }
      } else if (/true|false/.test(match)) {
        cls = 'boolean';
      } else if (/null/.test(match)) {
        cls = 'null';
      }
      return '<span class="' + cls + '">' + match + '</span>';
    });
  }
</script>

</body>
</html>
